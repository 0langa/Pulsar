[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsar-agent"
version = "0.1.0"
description = "Pulsar: a local-first, coding-first autonomous agent for repository work"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pulsar contributors" }]
keywords = ["coding-agent", "cli", "llm", "local-first"]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pulsar = "pulsar_agent.cli.main:main"

[project.urls]
Homepage = "https://github.com/0langa/Pulsar"

[tool.setuptools.packages.find]
include = ["pulsar_agent*"]

[tool.setuptools.package-data]
"pulsar_agent.skills" = ["builtin/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
