[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsar-agent"
version = "0.1.0"
description = "Pulsar: a local-first, coding-first autonomous agent for repository work"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pulsar contributors" }]
keywords = ["coding-agent", "cli", "llm", "local-first"]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
tui = ["textual>=0.80"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "textual>=0.80",
    "types-PyYAML",
]

[project.scripts]
pulsar = "pulsar_agent.cli.main:main"

[project.urls]
Homepage = "https://github.com/0langa/Pulsar"

[tool.setuptools.packages.find]
include = ["pulsar_agent*"]

[tool.setuptools.package-data]
"pulsar_agent.skills" = ["builtin/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pulsar_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = [
    "E501",   # long lines in prompts/docs strings; line-length is advisory
    "RUF001", # intentional unicode (ellipsis, box drawing) in UI strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["pulsar_agent"]
ignore_missing_imports = true      # textual/yaml stubs optional
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
# Beta posture: full strict mode deferred (see PROJECT_STATE.md); the codebase
# is annotated where it matters (security/, tools/, providers/ interfaces).

[tool.bandit]
exclude_dirs = ["tests", "research", ".venv"]
# Justified skips — each is load-bearing product behavior, not an oversight:
# B404/B603/B602/B607: subprocess and shell execution IS the terminal tool;
#   every invocation is risk-classified, approval-gated, env-scrubbed (see
#   SECURITY.md). B110: deliberate best-effort cleanup paths.
skips = ["B404", "B603", "B602", "B607", "B110"]
